name: Publish verified Bedrock Installer and Uninstaller ZIPs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-bedrock-tools.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public release collection
        uses: actions/checkout@v4

      - name: Retrieve verified ZIPs from successful private Windows build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          url=bytes.fromhex("").decode("utf-8")
          with urlopen(url,timeout=90) as response:
              data=response.read()
          packages={
              "Minecraft_Bedrock_Batch_Installer_V11.8.zip":{"ANLEITUNG.txt","Minecraft_Bedrock_Batch_Installer.ps1","Start_Installer.cmd"},
              "Minecraft_Bedrock_Batch_Uninstaller_V1.5.zip":{"ANLEITUNG.txt","Minecraft_Bedrock_Batch_Uninstaller.ps1","Start_Uninstaller.cmd"},
          }
          with ZipFile(BytesIO(data)) as artifact:
              assert set(artifact.namelist())==set(packages),artifact.namelist()
              for name,expected in packages.items():
                  item=artifact.read(name)
                  with ZipFile(BytesIO(item)) as archive:
                      assert set(archive.namelist())==expected,(name,archive.namelist())
                      assert archive.testzip() is None,name
                      script=next(x for x in expected if x.endswith(".ps1"))
                      header=archive.read(script).decode("utf-8-sig").splitlines()[0]
                      version="V11.8" if "Installer_V" in name else "1.5"
                      assert version in header,(name,header)
                  Path("dist",name).write_bytes(item)
                  print("Verified",name,len(item),"bytes")
          PY

      - name: Publish separate public releases (do not replace existing assets)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local tag="$1" title="$2" file="$3" notes="$4"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists; confirming archive."
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$file"
            else
              gh release create "$tag" "dist/$file" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes-file "$notes"
            fi
          }
          publish "bulk-installer-v11.8" "Minecraft Bedrock Batch Installer V11.8" "Minecraft_Bedrock_Batch_Installer_V11.8.zip" "Releases/Bulk-Installer-Uninstaller/RELEASE_NOTES_INSTALLER_V11.8.md"
          publish "bulk-uninstaller-v1.5" "Minecraft Bedrock Batch Uninstaller V1.5" "Minecraft_Bedrock_Batch_Uninstaller_V1.5.zip" "Releases/Bulk-Installer-Uninstaller/RELEASE_NOTES_UNINSTALLER_V1.5.md"
